name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app.py src pages scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Check metrics runner CLI
        run: python scripts/run_temacd_period_table.py --help
