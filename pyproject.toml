[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drbl-matrix-platform"
version = "1.0.0"
description = "Česká Streamlit aplikace pro ALM, DRBL Matrix a Combined backtest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.50.0",
  "pandas==2.3.3",
  "numpy==2.2.6",
  "plotly==6.3.1",
  "yfinance==0.2.66",
  "pandas-market-calendars==5.2.3",
  "ib_async==2.0.1",
  "pyarrow==21.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "mypy==1.18.2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E702", "E704", "I001", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
